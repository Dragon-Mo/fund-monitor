<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>基金分批计划</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#07111f;--card:#101d30;--line:#263750;--muted:#91a2b9;--blue:#38bdf8;--red:#fb7185;--green:#34d399;--gold:#fbbf24}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#07111f,#0c1728);color:#e6edf6;font:14px system-ui,-apple-system,"Microsoft YaHei",sans-serif}.wrap{max-width:920px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:15px}.top h1{font-size:20px;margin:0}.muted{color:var(--muted);font-size:12px}.card{background:rgba(16,29,48,.96);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 10px 28px #0003}.fund-tabs{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.tab,.btn{border:1px solid var(--line);background:#17263a;color:#e6edf6;border-radius:10px;padding:9px 13px;cursor:pointer;white-space:nowrap}.tab.active,.btn.primary{background:#0ea5e9;border-color:#0ea5e9;color:white}.btn.danger{color:#fda4af}.hero{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:12px;align-items:center}.name{font-size:20px;font-weight:750}.nav{font-size:32px;font-weight:800;margin-top:7px}.up{color:var(--red)}.down{color:var(--green)}.metric{background:#0b1727;border-radius:12px;padding:12px}.metric b{display:block;font-size:20px;margin-top:5px}.status{margin-top:13px;padding:11px 13px;border-radius:11px;background:#0b1727;border-left:4px solid var(--blue)}.status.hit{border-color:var(--gold);color:#fde68a}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.settings{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:12px 0}label{font-size:12px;color:var(--muted)}input,select{width:100%;margin-top:5px;background:#07111f;border:1px solid var(--line);border-radius:8px;color:#fff;padding:9px}table{width:100%;border-collapse:collapse}th,td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:center}th{color:var(--muted);font-size:12px}.small-input{width:86px;text-align:center;margin:0}.done{opacity:.5}.badge{display:inline-block;padding:3px 8px;border-radius:99px;background:#25364e;font-size:11px}.badge.hit{background:#713f12;color:#fde68a}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}#chart{height:290px}.records{max-height:260px;overflow:auto}.record{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}.empty{text-align:center;color:var(--muted);padding:24px}.foot{text-align:center;color:var(--muted);font-size:11px;padding:8px;line-height:1.6}
@media(max-width:700px){.wrap{padding:12px}.hero,.grid{grid-template-columns:1fr}.hero{gap:8px}.settings{grid-template-columns:1fr 1fr}.name{font-size:17px}.nav{font-size:29px}.small-input{width:70px}th,td{padding:8px 2px;font-size:12px}}
</style>
</head>
<body><div class="wrap">
  <div class="top"><div><h1>基金分批计划</h1><div class="muted" id="updated">正在读取数据…</div></div><button class="btn" onclick="location.reload()">刷新</button></div>
  <div class="card"><div class="fund-tabs" id="tabs"></div><div class="actions"><button class="btn primary" onclick="addFund()">＋ 增加基金</button><button class="btn" onclick="editFund()">修改当前基金</button><button class="btn danger" onclick="removeFund()">删除当前基金</button></div></div>
  <div class="card" id="portfolio"></div>
  <div id="app"><div class="card empty">正在加载…</div></div>
  <div class="foot">正式净值通常在交易日收盘后公布；目标ETF只作盘中参考，不等于基金最终净值。工具仅记录计划，不会自动交易。</div>
</div>
<script>
let funds=[], current=null, chart=null;
const keyOf=code=>'fund-plan-v2-'+code;
const fundListKey='fund-custom-list-v1';
const n=(v,d=0)=>Number.isFinite(Number(v))?Number(v):d;
const money=v=>'¥'+n(v).toFixed(2);
const pct=v=>(n(v)>=0?'+':'')+n(v).toFixed(2)+'%';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function defaultState(f){const d=f.defaults||{};return{budget:n(d.budget,1000),count:n(d.level_count,5),step:n(d.step_pct,5),allocation:d.allocation||'increasing',anchor:n(f.nav,1),shares:0,costPrice:0,levels:[],records:[]}}
function loadState(f){let s;try{s=JSON.parse(localStorage.getItem(keyOf(f.code)))}catch(e){}s=Object.assign(defaultState(f),s||{});if(!n(s.costPrice)&&n(s.shares)>0&&n(s.totalCost)>0)s.costPrice=n(s.totalCost)/n(s.shares);if(!s.levels?.length)generate(s);return s}
function saveState(s){localStorage.setItem(keyOf(current.code),JSON.stringify(s))}
function generate(s){const count=Math.max(2,Math.min(10,Math.round(n(s.count,5))));const budget=Math.max(0,n(s.budget));let weights=Array(count).fill(1);if(s.allocation==='increasing')weights=weights.map((_,i)=>i+2);const sum=weights.reduce((a,b)=>a+b,0);let used=0;s.levels=weights.map((w,i)=>{let amount=i===count-1?budget-used:Math.round(budget*w/sum);used+=amount;return{nav:+(n(s.anchor)*(1-n(s.step)*i/100)).toFixed(4),amount,done:false}});s.count=count}

function customList(){try{return JSON.parse(localStorage.getItem(fundListKey))||[]}catch(e){return[]}}
function saveFundList(){localStorage.setItem(fundListKey,JSON.stringify(funds.map(f=>({code:f.code,name:f.name,etfCode:f.etfCode||'',etfName:f.etfName||'',indexCode:f.indexCode||'',indexName:f.indexName||'',custom:!!f.custom}))));}
function normalizeMarketCode(code){code=String(code||'').trim().toLowerCase();if(!code)return'';if(/^\d{6}$/.test(code))return(code.startsWith('5')||code.startsWith('0'))?'sh'+code:'sz'+code;return code}
function jsonp(url){return new Promise((resolve,reject)=>{const cb='fmcb'+Date.now()+Math.random().toString(16).slice(2),s=document.createElement('script'),timer=setTimeout(()=>done(Error('行情请求超时')),10000);function done(err,val){clearTimeout(timer);s.remove();delete window[cb];err?reject(err):resolve(val)}window[cb]=v=>done(null,v);s.onerror=()=>done(Error('行情请求失败'));s.src=url.replace('{callback}',cb);document.head.appendChild(s)})}
async function fetchFundEstimate(code){return jsonp(`https://fundgz.1234567.com.cn/js/${code}.js?rt=${Date.now()}&jsonpgz={callback}`)}
async function fetchMarketQuote(code){code=normalizeMarketCode(code);if(!code)return null;await new Promise((resolve,reject)=>{const s=document.createElement('script'),timer=setTimeout(()=>{s.remove();reject(Error('行情请求超时'))},10000);s.onload=()=>{clearTimeout(timer);s.remove();resolve()};s.onerror=()=>{clearTimeout(timer);s.remove();reject(Error('行情请求失败'))};s.src='https://qt.gtimg.cn/q='+code+'&t='+Date.now();document.head.appendChild(s)});const raw=window['v_'+code];if(!raw)return null;const x=raw.split('~');return{code,name:x[1],price:n(x[3]),prevClose:n(x[4]),pct:n(x[32]),time:x[30]}}
async function refreshFund(f){try{if(f.custom||!f.nav){const q=await fetchFundEstimate(f.code);if(q){f.name=f.name||q.name;f.nav=n(q.dwjz);f.navDate=q.jzrq;f.navPct=n(q.gszzl);f.estimateNav=n(q.gsz);f.estimateTime=q.gztime}}f.etf=await fetchMarketQuote(f.etfCode).catch(()=>f.etf||null);f.index=await fetchMarketQuote(f.indexCode).catch(()=>f.index||null);if(current?.code===f.code)render()}catch(e){console.warn(e)}}
async function init(){try{const r=await fetch('data.json?t='+Date.now());const data=await r.json();document.getElementById('updated').textContent='行情更新：'+(data.updated||'--');const server=(data.users||[]).flatMap(u=>u.funds||[]),saved=customList();funds=saved.length?saved.map(meta=>Object.assign({},server.find(x=>x.code===meta.code)||{},meta)):server;if(!funds.length)throw Error('没有配置基金');selectFund(funds[0].code);funds.forEach(refreshFund)}catch(e){document.getElementById('app').innerHTML='<div class="card empty">数据加载失败：'+esc(e.message)+'</div>'}}
function selectFund(code){current=funds.find(f=>f.code===code);document.getElementById('tabs').innerHTML=funds.map(f=>`<button class="tab ${f.code===code?'active':''}" onclick="selectFund('${f.code}')">${esc(f.name)} · ${f.code}</button>`).join('');render()}
function nextLevel(s){return s.levels.find(l=>!l.done)}
function prediction(f){const iw=n(f.indexWeight,.7),rate=n(f.positionRate,.95),ip=f.index?n(f.index.pct):NaN,ep=f.etf?n(f.etf.pct):NaN;let raw=Number.isFinite(ip)&&Number.isFinite(ep)?ip*iw+ep*(1-iw):Number.isFinite(ip)?ip:Number.isFinite(ep)?ep:n(f.navPct);const pct=raw*rate;return{pct,nav:n(f.nav)*(1+pct/100)}}
function holding(s,nav=n(current.nav)){const shares=n(s.shares),avg=n(s.costPrice),cost=shares*avg,value=shares*nav,pnl=value-cost;return{shares,cost,avg,value,pnl,pnlRate:cost>0?pnl/cost*100:0}}
function renderPortfolio(){let cost=0,value=0,predValue=0;funds.forEach(f=>{const s=loadState(f),h=holdingFor(f,s,n(f.nav)),ph=holdingFor(f,s,prediction(f).nav);cost+=h.cost;value+=h.value;predValue+=ph.value});const pnl=value-cost,pp=predValue-cost;document.getElementById('portfolio').innerHTML=`<b>全部基金汇总</b><div class="settings"><div class="metric"><span class="muted">实际投入总成本</span><b>${money(cost)}</b></div><div class="metric"><span class="muted">最新总金额</span><b>${money(value)}</b></div><div class="metric"><span class="muted">正式盈亏 / 盈亏率</span><b class="${pnl>=0?'up':'down'}">${money(pnl)} · ${cost?pct(pnl/cost*100):'--'}</b></div><div class="metric"><span class="muted">盘中预测盈亏</span><b class="${pp>=0?'up':'down'}">${money(pp)}</b></div></div>`}
function holdingFor(f,s,nav){const old=current;current=f;const h=holding(s,nav);current=old;return h}
function render(){const s=loadState(current),h=holding(s),pred=prediction(current),ph=holding(s,pred.nav),next=nextLevel(s),hit=next&&n(pred.nav)<=n(next.nav);const e=current.etf,idx=current.index;renderPortfolio();document.getElementById('app').innerHTML=`
<section class="card"><div class="hero"><div><div class="name">${esc(current.name)} <span class="badge">${current.code}</span></div><div class="nav ${pred.pct>=0?'up':'down'}">${pred.nav.toFixed(4)}</div><div class="muted">盘中预测净值 · <span class="${pred.pct>=0?'up':'down'}">${pct(pred.pct)}</span><br>正式净值 ${n(current.nav).toFixed(4)} · ${esc(current.navDate||'--')}</div></div><div class="metric"><span class="muted">跟踪指数</span><b class="${idx&&n(idx.pct)>=0?'up':'down'}">${idx?pct(idx.pct):'暂无'}</b></div><div class="metric"><span class="muted">目标ETF ${esc(current.etfCode||'未配置')}</span><b>${e?n(e.price).toFixed(3):'--'}</b><span class="${e&&n(e.pct)>=0?'up':'down'}">${e?pct(e.pct):'暂无'}</span></div></div><div class="status ${hit?'hit':''}">${!next?'全部档位已执行':hit?`预测已触发：净值 ≤ ${n(next.nav).toFixed(4)}，计划 ${money(next.amount)}`:`下一档：预测净值 ≤ ${n(next.nav).toFixed(4)}，距离约 ${((pred.nav/n(next.nav)-1)*100).toFixed(2)}%`}</div></section>
<div class="grid"><div><section class="card"><b>自动预算与档位</b><div class="settings"><label>总预算<input id="budget" type="number" value="${s.budget}"></label><label>档位数<input id="count" type="number" min="2" max="10" value="${s.count}"></label><label>每档跌幅<input id="step" type="number" step="0.5" value="${s.step}"></label><label>分配方式<select id="allocation"><option value="increasing" ${s.allocation==='increasing'?'selected':''}>越跌越多</option><option value="equal" ${s.allocation==='equal'?'selected':''}>平均分配</option></select></label><label>起始净值<input id="anchor" type="number" step="0.0001" value="${s.anchor}"></label><label>持有份额<input id="shares" type="number" step="0.01" value="${s.shares}"></label><label>持仓成本价<input id="costPrice" type="number" step="0.0001" value="${n(s.costPrice).toFixed(4)}"></label></div><div class="actions"><button class="btn primary" onclick="autoPlan()">重新自动生成</button><button class="btn" onclick="saveInputs()">保存持仓并计算</button></div><table><thead><tr><th>档位</th><th>触发净值</th><th>金额</th><th>状态</th></tr></thead><tbody>${s.levels.map((l,i)=>`<tr class="${l.done?'done':''}"><td>${i+1}</td><td><input class="small-input" type="number" step="0.0001" value="${l.nav}" onchange="editLevel(${i},'nav',this.value)"></td><td><input class="small-input" type="number" value="${l.amount}" onchange="editLevel(${i},'amount',this.value)"></td><td>${l.done?'<span class="badge">已执行</span>':n(current.nav)<=n(l.nav)?`<button class="btn primary" onclick="buy(${i})">记录买入</button>`:'<span class="badge">等待</span>'}</td></tr>`).join('')}</tbody></table><div class="muted" style="margin-top:9px">已分配 ${money(s.levels.reduce((a,l)=>a+n(l.amount),0))}；修改单档后会保留手动数值。</div></section><section class="card"><b>近180个交易日净值</b><div id="chart"></div></section></div>
<div><section class="card"><b>持仓概览</b><div class="record"><span>持有份额</span><b>${h.shares.toFixed(2)}</b></div><div class="record"><span>持仓成本价</span><b>${h.avg?h.avg.toFixed(4):'--'}</b></div><div class="record"><span>实际投入成本</span><b>${money(h.cost)}</b></div><div class="record"><span>正式净值总金额</span><b>${money(h.value)}</b></div><div class="record"><span>正式盈亏 / 盈亏率</span><b class="${h.pnl>=0?'up':'down'}">${money(h.pnl)} · ${h.cost?pct(h.pnlRate):'--'}</b></div><div class="record"><span>盘中预测盈亏</span><b class="${ph.pnl>=0?'up':'down'}">${money(ph.pnl)}</b></div><div class="muted" style="margin-top:10px">盘中预测盈亏＝持有份额 × 预测净值－实际投入成本，仅供参考。</div></section><section class="card"><b>买入记录</b><div class="records">${s.records.length?s.records.slice().reverse().map(r=>`<div class="record"><span>${esc(r.date)} · 第${r.level+1}档<br><small class="muted">净值 ${n(r.nav).toFixed(4)}</small></span><b>${money(r.amount)}</b></div>`).join(''):'<div class="empty">暂无记录</div>'}</div><div class="actions"><button class="btn" onclick="exportData()">导出备份</button><button class="btn" onclick="document.getElementById('importFile').click()">导入</button><input id="importFile" type="file" accept="application/json" hidden onchange="importData(this)"></div></section></div></div>`;drawChart(current.history||[],s)}

function fundForm(base={}){const code=prompt('场外基金代码（6位）',base.code||'');if(code===null)return null;if(!/^\d{6}$/.test(code.trim())){alert('请输入6位基金代码');return null}const name=(prompt('基金名称（可以先留空，联网后自动识别）',base.name||'')??base.name??code);const etfCode=normalizeMarketCode(prompt('目标ETF代码（可留空，例如516650）',String(base.etfCode||'').replace(/^(sh|sz)/,''))??base.etfCode);const indexCode=normalizeMarketCode(prompt('跟踪指数代码（可留空，例如000811）',String(base.indexCode||'').replace(/^(sh|sz)/,''))??base.indexCode);const indexName=(prompt('指数名称（可留空）',base.indexName||'')??base.indexName??'');return Object.assign({},base,{code:code.trim(),name:name.trim()||code.trim(),etfCode,indexCode,indexName,custom:true,defaults:base.defaults||{budget:1000,level_count:5,step_pct:5,allocation:'increasing'}})}
function addFund(){const f=fundForm();if(!f)return;if(funds.some(x=>x.code===f.code)){alert('该基金已经存在，请使用“修改当前基金”');return}funds.push(f);saveFundList();selectFund(f.code);refreshFund(f)}
function editFund(){if(!current)return;const f=fundForm(current);if(!f)return;const i=funds.findIndex(x=>x.code===current.code);if(f.code!==current.code&&funds.some((x,j)=>j!==i&&x.code===f.code)){alert('新代码已经存在');return}funds[i]=f;saveFundList();current=f;selectFund(f.code);refreshFund(f)}
function removeFund(){if(!current||funds.length<=1){alert('至少保留一只基金');return}if(!confirm(`确认从列表删除 ${current.name}（${current.code}）？本机持仓备份仍会保留。`))return;const old=current.code;funds=funds.filter(f=>f.code!==old);saveFundList();selectFund(funds[0].code)}

function readInputs(s){s.budget=n(document.getElementById('budget').value);s.count=n(document.getElementById('count').value);s.step=n(document.getElementById('step').value);s.anchor=n(document.getElementById('anchor').value);s.allocation=document.getElementById('allocation').value;s.shares=n(document.getElementById('shares').value);s.costPrice=n(document.getElementById('costPrice').value);delete s.totalCost;return s}
function autoPlan(){const s=readInputs(loadState(current));if(s.levels.some(l=>l.done)&&!confirm('重新生成会清除档位执行状态，但不会删除买入记录。继续吗？'))return;generate(s);saveState(s);render()}
function saveInputs(){const s=readInputs(loadState(current));saveState(s);render()}
function editLevel(i,k,v){const s=loadState(current);s.levels[i][k]=n(v);saveState(s);render()}
function buy(i){const s=loadState(current),l=s.levels[i];const amount=n(prompt('实际买入金额（元）',l.amount),NaN);if(!Number.isFinite(amount)||amount<=0)return;const nav=n(prompt('实际确认净值；尚未确认可先填当前净值',current.nav),NaN);if(!Number.isFinite(nav)||nav<=0)return;const oldShares=n(s.shares),oldCost=oldShares*n(s.costPrice),newShares=amount/nav;s.records.push({date:new Date().toLocaleDateString('zh-CN'),level:i,amount,nav});s.shares=oldShares+newShares;s.costPrice=(oldCost+amount)/s.shares;delete s.totalCost;l.amount=amount;l.done=true;saveState(s);render()}
function exportData(){const payload={version:2,exportedAt:new Date().toISOString(),states:{}};funds.forEach(f=>payload.states[f.code]=loadState(f));const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));a.download='fund-plan-backup.json';a.click();URL.revokeObjectURL(a.href)}
function importData(input){const file=input.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const p=JSON.parse(reader.result);Object.entries(p.states||{}).forEach(([code,s])=>localStorage.setItem(keyOf(code),JSON.stringify(s)));render()}catch(e){alert('备份文件无效')}};reader.readAsText(file)}
function drawChart(rows,s){const el=document.getElementById('chart');chart=echarts.init(el);chart.setOption({tooltip:{trigger:'axis'},grid:{left:48,right:15,top:20,bottom:35},xAxis:{type:'category',data:rows.map(r=>r.date),axisLabel:{color:'#91a2b9',fontSize:9}},yAxis:{type:'value',scale:true,axisLabel:{color:'#91a2b9'},splitLine:{lineStyle:{color:'#263750'}}},dataZoom:[{type:'inside',start:55,end:100}],series:[{type:'line',data:rows.map(r=>r.nav),symbol:'none',lineStyle:{color:'#38bdf8',width:2},markLine:{symbol:'none',label:{color:'#fbbf24'},lineStyle:{type:'dashed',color:'#8b6b18'},data:s.levels.filter(l=>!l.done).map((l,i)=>({name:'档'+(i+1),yAxis:l.nav}))}}]});window.onresize=()=>chart&&chart.resize()}
init();
</script></body></html>
