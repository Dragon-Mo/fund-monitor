name: Update Fund & Stock Data

on:
  schedule:
    # 工作日北京时间 09:00-15:59，每 30 分钟更新目标 ETF。
    - cron: '*/30 1-7 * * 1-5'
    # 工作日北京时间 21:10 再取一次正式基金净值。
    - cron: '10 13 * * 1-5'
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch data
        run: python fetch.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No data change, skip commit"
          else
            git commit -m "chore: update market data $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push
          fi
